<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><title>CONFRMED — Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#111;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1000px;margin:auto;padding:22px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-size:36px;font-weight:1000;font-style:italic;letter-spacing:-8px;transform:skew(-12deg);width:54px}.muted{color:#858992;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.tabs{display:flex;gap:7px;background:#ebedf0;padding:5px;border-radius:16px}.tabs button{border:0;border-radius:12px;padding:11px 17px;background:transparent;color:#777}.tabs .active{background:#fff;color:#111;box-shadow:0 1px 4px #0001}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}h1{font-size:32px;letter-spacing:-1.5px;margin:5px 0}.btn{border:0;background:#101113;color:#fff;border-radius:12px;padding:13px 17px;font-weight:650}.ghost{background:#fff;color:#222;border:1px solid #e7e8ea}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e9ebee;border-radius:20px;padding:20px}.metric{font-size:26px;font-weight:750;letter-spacing:-1px;margin-top:13px}.positive{color:#169b68}.negative{color:#d84b56}.section{display:grid;grid-template-columns:1.25fr .75fr;gap:15px;margin-top:15px}.panel h2{font-size:17px;margin:0 0 18px}.chart{width:100%;height:210px}.legend{font-size:13px;color:#999}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calhead button{border:0;background:#f1f2f4;border-radius:9px;padding:8px 13px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:#9b9da5;font-size:11px;padding:8px 0}.day{min-height:69px;background:#f3f4f6;border:1px solid transparent;border-radius:12px;padding:9px 5px;text-align:center}.day b{display:block;font-size:13px}.day small{display:block;font-size:10px;margin-top:7px}.day.win{background:#e4f7ec;color:#128b58}.day.loss{background:#fde9eb;color:#c53f4e}.day.selected{border:2px solid #111}.day.blank{visibility:hidden}.bet{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #f0f0f2;padding:15px 0}.bet strong{display:block;font-size:14px}.bet small{display:block;color:#999;margin-top:5px}.pill{display:inline-block;font-size:11px;border-radius:7px;padding:5px 8px;background:#eee;color:#555}.pill.won{background:#e5f7ec;color:#148b5a}.pill.lost{background:#fde8eb;color:#c74350}.amount{font-weight:700;text-align:right}.actions{display:flex;gap:8px;margin-top:6px;justify-content:flex-end}.actions button{border:0;background:transparent;color:#92959a;font-size:12px}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.toolbar select{border:1px solid #e3e4e6;padding:10px;border-radius:10px;background:#fff}.empty{color:#a1a4aa;text-align:center;padding:30px 10px}dialog{border:0;border-radius:22px;padding:25px;width:min(460px,94vw);box-shadow:0 25px 80px #0003}dialog::backdrop{background:#0007}dialog h2{margin-top:0}label{display:block;font-size:12px;color:#777;margin:13px 0 5px}input,select{width:100%;padding:12px;border:1px solid #e2e4e8;border-radius:10px;background:#fff}input:focus{outline:2px solid #aaa}form .buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}.foot button{font-size:12px}.file{display:none}@media(max-width:720px){.shell{padding:18px 13px 80px}.cards{grid-template-columns:repeat(2,1fr)}.section{grid-template-columns:1fr}.top{margin-bottom:24px}.tabs button{padding:10px 12px;font-size:12px}.hero h1{font-size:27px}.card,.panel{padding:15px}.metric{font-size:24px}.day{min-height:58px;padding:7px 2px}.day small{font-size:9px}.btn{padding:12px}.cal{gap:4px}}</style></head><body><div class="shell">
<header class="top"><div class="logo" aria-label="CONFRMED">C</div><nav class="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="calendar">Kalender</button><button data-tab="bets">Bets</button></nav></header>
<div class="hero"><div><div class="muted">PERSONAL PERFORMANCE TRACKER</div><h1 id="heading">Dashboard</h1></div><button class="btn" id="new">+ Nieuwe bet</button></div>
<section id="dashboard"><div class="cards"><div class="card"><div class="muted">Netto winst</div><div class="metric" id="profit">€ 0,00</div></div><div class="card"><div class="muted">Winrate</div><div class="metric" id="winrate">0%</div></div><div class="card"><div class="muted">Afgeronde bets</div><div class="metric" id="total">0</div></div><div class="card"><div class="muted">Gem. odd</div><div class="metric" id="avg">—</div></div></div><div class="section"><div class="panel"><h2>Winstontwikkeling</h2><svg class="chart" id="chart" viewBox="0 0 500 210" preserveAspectRatio="none"></svg><div class="legend">Cumulatieve netto winst in euro</div></div><div class="panel"><h2>Recente bets</h2><div id="recent"></div></div></div></section>
<section id="calendar" class="hidden"><div class="panel"><div class="calhead"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><div class="cal" id="cal"></div></div><div class="panel" style="margin-top:15px"><h2 id="daytitle">Geselecteerde dag</h2><div id="daybets"></div></div></section>
<section id="bets" class="hidden"><div class="panel"><div class="toolbar"><h2 style="margin:0">Alle bets</h2><select id="filter" style="width:auto"><option value="all">Alles</option><option value="open">Open</option><option value="won">Gewonnen</option><option value="lost">Verloren</option><option value="void">Void</option></select></div><div id="allbets"></div></div></section>
<div class="foot"><button class="btn ghost" id="export">Exporteer backup</button><button class="btn ghost" id="import">Importeer backup</button><input class="file" type="file" id="file" accept="application/json"></div>
</div><dialog id="dialog"><form id="form"><h2 id="formtitle">Nieuwe bet</h2><input type="hidden" id="id"><label>Datum</label><input id="date" type="date" required><label>Wedstrijd(en)</label><input id="match" placeholder="Arsenal - Newcastle" required maxlength="300"><label>Voorspelling</label><input id="pick" placeholder="Arsenal wint" required maxlength="300"><label>Type</label><select id="type"><option value="Single">Single</option><option value="Builder">Builder</option></select><label>Odd</label><input id="odds" type="number" min="1.01" step="0.01" value="2.00" required><label>Inzet (€)</label><input id="stake" type="number" min="0.01" step="0.01" value="10" required><label>Status</label><select id="status"><option value="open">Open</option><option value="won">Gewonnen</option><option value="lost">Verloren</option><option value="void">Void</option></select><div class="buttons"><button type="button" class="btn ghost" id="cancel">Annuleren</button><button class="btn" type="submit">Opslaan</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),eur=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bets=[];try{let x=JSON.parse(localStorage.getItem('confrmed-bets')||'[]');if(Array.isArray(x))bets=x}catch(e){}
let view=new Date(),selected=iso(new Date()),tab='dashboard';view.setDate(1);
const result=b=>b.status==='won'?Number(b.stake)*(Number(b.odds)-1):b.status==='lost'?-Number(b.stake):0,save=()=>{localStorage.setItem('confrmed-bets',JSON.stringify(bets));render()},sorted=()=>[...bets].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
function list(items){if(!items.length)return '<div class="empty">Nog geen bets geregistreerd</div>';return items.map(b=>{let p=result(b),status={won:'Gewonnen',lost:'Verloren',open:'Open',void:'Void'}[b.status]||b.status;return '<div class="bet"><div><strong>'+escape(b.match)+'</strong><small>'+escape(b.pick)+' · '+escape(b.type)+' · '+Number(b.odds).toFixed(2)+' odd · '+eur(Number(b.stake))+' inzet</small><small>'+escape(b.date)+'</small></div><div><span class="pill '+escape(b.status)+'">'+status+'</span><div class="amount '+(p>0?'positive':p<0?'negative':'')+'" style="margin-top:7px">'+(b.status==='open'?'—':eur(p))+'</div><div class="actions"><button data-edit="'+escape(b.id)+'">Wijzig</button><button data-del="'+escape(b.id)+'">Wis</button></div></div></div>'}).join('')}
function render(){let done=bets.filter(b=>b.status==='won'||b.status==='lost'),wins=done.filter(b=>b.status==='won').length,profit=done.reduce((s,b)=>s+result(b),0),odd=done.length?done.reduce((s,b)=>s+Number(b.odds),0)/done.length:0;$('profit').textContent=eur(profit);$('profit').className='metric '+(profit>0?'positive':profit<0?'negative':'');$('winrate').textContent=done.length?Math.round(100*wins/done.length)+'%':'0%';$('total').textContent=done.length;$('avg').textContent=odd?odd.toFixed(2):'—';$('recent').innerHTML=list(sorted().slice(0,4));$('allbets').innerHTML=list(sorted().filter(b=>$('filter').value==='all'||b.status===$('filter').value));$('daytitle').textContent=new Date(selected+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('daybets').innerHTML=list(sorted().filter(b=>b.date===selected));renderCalendar();renderChart()}
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth();$('month').textContent=view.toLocaleDateString('nl-NL',{month:'long',year:'numeric'});let first=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate(),html=['ma','di','wo','do','vr','za','zo'].map(d=>'<div class="weekday">'+d+'</div>').join('');for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=count;d++){let date=iso(new Date(y,m,d)),daily=bets.filter(b=>b.date===date&&(b.status==='won'||b.status==='lost')),p=daily.reduce((s,b)=>s+result(b),0);html+='<button class="day '+(p>0?'win':p<0?'loss':'')+(selected===date?' selected':'')+'" data-day="'+date+'"><b>'+d+'</b><small>'+(daily.length?eur(p):'')+'</small></button>'}$('cal').innerHTML=html}
function renderChart(){let arr=[...bets].filter(b=>b.status==='won'||b.status==='lost').sort((a,b)=>a.date.localeCompare(b.date)),values=[0],sum=0;arr.forEach(b=>{sum+=result(b);values.push(sum)});let min=Math.min(...values,0),max=Math.max(...values,0),range=max-min||1,pts=values.map((v,i)=>[25+(450*i/Math.max(1,values.length-1)),180-(v-min)/range*145]),line=pts.map(p=>p.join(',')).join(' ');$('chart').innerHTML='<line x1="25" y1="180" x2="475" y2="180" stroke="#e8e9ec"/><line x1="25" y1="110" x2="475" y2="110" stroke="#f0f1f3"/><line x1="25" y1="35" x2="475" y2="35" stroke="#f0f1f3"/><polyline points="'+line+'" fill="none" stroke="'+(sum<0?'#d84b56':'#159b68')+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+pts.at(-1)[0]+'" cy="'+pts.at(-1)[1]+'" r="5" fill="'+(sum<0?'#d84b56':'#159b68')+'"/>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['dashboard','calendar','bets'].forEach(x=>$(x).classList.toggle('hidden',x!==tab));$('heading').textContent={dashboard:'Dashboard',calendar:'Kalender',bets:'Mijn bets'}[tab];render()});
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('filter').onchange=render;
document.addEventListener('click',e=>{let b=e.target.closest('[data-day],[data-edit],[data-del]');if(!b)return;if(b.dataset.day){selected=b.dataset.day;render()}if(b.dataset.edit){let bet=bets.find(x=>String(x.id)===b.dataset.edit);if(bet)openForm(bet)}if(b.dataset.del){if(confirm('Deze bet verwijderen?')){bets=bets.filter(x=>String(x.id)!==b.dataset.del);save()}}});
function openForm(b){$('form').reset();$('formtitle').textContent=b?'Bet wijzigen':'Nieuwe bet';$('id').value=b?.id||'';$('date').value=b?.date||iso(new Date());$('match').value=b?.match||'';$('pick').value=b?.pick||'';$('type').value=b?.type||'Single';$('odds').value=b?.odds||2;$('stake').value=b?.stake||10;$('status').value=b?.status||'open';$('dialog').showModal()}
$('new').onclick=()=>openForm();$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value||String(Date.now()),bet={id,date:$('date').value,match:$('match').value.trim(),pick:$('pick').value.trim(),type:$('type').value,odds:Number($('odds').value),stake:Number($('stake').value),status:$('status').value};if(!bet.match||!bet.pick||!Number.isFinite(bet.odds)||bet.odds<1.01||!Number.isFinite(bet.stake)||bet.stake<=0)return;let index=bets.findIndex(x=>String(x.id)===id);if(index<0)bets.push(bet);else bets[index]=bet;$('dialog').close();save()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(bets,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='confrmed-backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x)||!x.every(b=>b&&typeof b.date==='string'&&typeof b.match==='string'&&typeof b.pick==='string'&&['open','won','lost','void'].includes(b.status)&&Number.isFinite(Number(b.odds))&&Number.isFinite(Number(b.stake))))throw Error('Ongeldige backup');if(confirm('Huidige bets vervangen door de backup?')){bets=x;save()}}catch(err){alert('Import mislukt: '+err.message)}e.target.value=''};render();
</script></body></html>
